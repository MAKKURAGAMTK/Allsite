<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P5M MKG</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e8873d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="P5M MKG">
<style>
  :root{
    --orange:#e8873d;
    --orange-dark:#c96f2a;
    --blue:#3d94c9;
    --blue-dark:#2c7aab;
    --bg:#f5f7f8;
    --card:#ffffff;
    --border:#e2e6e9;
    --text:#25313a;
    --text-mute:#8592a0;
    --hadir:#3a8f5c;
    --izin:#c98a1f;
    --sakit:#8a5fc9;
    --cuti:#3d94c9;
    --alfa:#c9403a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    border-top:4px solid var(--blue);
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
    gap:14px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{width:40px;height:40px;flex-shrink:0;}
  header h1{font-size:18px;margin:0;font-weight:600;}
  header .sub{font-size:12px;color:var(--text-mute);margin-top:2px;}
  .header-actions{display:flex;gap:8px;align-items:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 14px;font-size:13px;}
  .btn-ghost:hover{background:#f0efed;}
  .btn-primary{background:var(--orange);color:#fff;padding:10px 20px;font-size:14px;font-weight:600;}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-primary:disabled{background:#d9c2ba;cursor:not-allowed;}

  main{max-width:880px;margin:0 auto;padding:20px 16px 150px;}
  .group-banner{background:#fff4e9;border:1px solid var(--orange);color:var(--orange-dark);font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;margin-bottom:14px;}
  .group-banner b{font-weight:700;}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar .btn-ghost{font-size:12px;padding:7px 12px;}

  .list-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .row .num{width:22px;font-size:12px;color:var(--text-mute);flex-shrink:0;}
  .row .name{flex:1 1 auto;min-width:0;font-size:14px;font-weight:500;}
  .row .name .name-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .name .jabatan{font-size:11px;font-weight:400;color:var(--text-mute);white-space:normal;margin-top:1px;}
  .status-group{display:flex;gap:6px;flex-shrink:0;}
  .status-btn{padding:6px 10px;font-size:12px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--text-mute);border-radius:7px;}
  .status-btn[data-status="HADIR"].active{background:var(--hadir);color:#fff;border-color:var(--hadir);}
  .status-btn[data-status="IZIN"].active{background:var(--izin);color:#fff;border-color:var(--izin);}
  .status-btn[data-status="SAKIT"].active{background:var(--sakit);color:#fff;border-color:var(--sakit);}
  .status-btn[data-status="CUTI"].active{background:var(--cuti);color:#fff;border-color:var(--cuti);}
  .status-btn[data-status="ALFA"].active{background:var(--alfa);color:#fff;border-color:var(--alfa);}

  .note-toggle{width:26px;height:26px;flex-shrink:0;border:1px solid var(--border);background:#fff;border-radius:7px;color:var(--text-mute);font-size:13px;display:flex;align-items:center;justify-content:center;}
  .note-toggle.has-note{border-color:var(--orange);color:var(--orange);}
  .note-input{display:none;padding:0 16px 12px;border-bottom:1px solid var(--border);}
  .note-input.open{display:block;}
  .note-input input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;}

  .empty, .loading{padding:40px 20px;text-align:center;color:var(--text-mute);font-size:13px;}

  .footer-bar{position:fixed;bottom:56px;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .footer-bar .summary{font-size:12px;color:var(--text-mute);}
  .footer-bar .summary b{color:var(--text);}

  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}
  .toast.error{background:var(--alfa);}
  .toast.ok{background:var(--hadir);}

  @media (max-width:520px){
    .row{flex-wrap:wrap;}
    .status-group{order:3;width:100%;justify-content:flex-start;padding-left:34px;flex-wrap:wrap;}
  }

  .hidden{display:none !important;}

  /* ===== bottom nav ===== */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);border-top:1px solid var(--border);
    display:flex;z-index:20;
  }
  .nav-btn{
    flex:1;background:transparent;border:none;padding:8px 4px 10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:11px;color:var(--text-mute);font-weight:500;
  }
  .nav-btn .icon{font-size:18px;line-height:1;}
  .nav-btn.active{color:var(--orange);}

  /* ===== onboarding modal ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,24,28,.55);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:200;
  }
  .modal-card{
    background:#fff;border-radius:16px;padding:28px 24px;
    max-width:380px;width:100%;text-align:center;
  }
  .modal-card .emoji{font-size:34px;margin-bottom:6px;}
  .modal-card h2{margin:0 0 4px;font-size:19px;}
  .modal-card .desc{font-size:13px;color:var(--text-mute);margin-bottom:20px;}
  .field{text-align:left;margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;}
  .field select{
    width:100%;padding:10px 12px;border:1px solid var(--border);
    border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);
  }
  .modal-card .btn-primary{width:100%;padding:12px;font-size:14px;margin-top:4px;}

  /* ===== riwayat ===== */
  .history-item{padding:12px 16px;border-bottom:1px solid var(--border);}
  .history-item:last-child{border-bottom:none;}
  .history-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
  .history-name{font-size:14px;font-weight:600;}
  .history-time{font-size:11px;color:var(--text-mute);white-space:nowrap;}
  .history-meta{font-size:12px;color:var(--text-mute);margin-top:2px;}
  .history-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;color:#fff;margin-top:4px;}
  .history-badge.HADIR{background:var(--hadir);}
  .history-badge.IZIN{background:var(--izin);}
  .history-badge.SAKIT{background:var(--sakit);}
  .history-badge.CUTI{background:var(--cuti);}
  .history-badge.ALFA{background:var(--alfa);}

  .history-bottom{display:flex;align-items:center;gap:10px;margin-top:6px;}
  .history-edit-btn{font-size:11px;padding:4px 10px;}
  .history-edit-box{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .history-edit-box.open{display:block;}
  .history-edit-box .status-group{flex-wrap:wrap;margin-bottom:8px;}
  .hist-note-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;margin-bottom:8px;}
  .hist-edit-actions{display:flex;gap:8px;}
  .hist-edit-actions .btn-primary{padding:8px 14px;font-size:12px;}
  .hist-edit-actions .btn-ghost{padding:8px 14px;font-size:12px;}

  /* ===== pengaturan ===== */
  .setting-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px;border-bottom:1px solid var(--border);
  }
  .setting-row:last-child{border-bottom:none;}
  .setting-label{font-size:13px;color:var(--text-mute);}
  .setting-value{font-size:14px;font-weight:600;}
</style>
</head>

<script>
// =====================================================
// KONFIGURASI: URL Web App Google Apps Script
// =====================================================
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbwJpP5yvgFISkZHpLdTbqw6BvOLuGS9DLVD0qxcblBc7_p0qsHNfoZ2oKpTjlSXKFaR/exec"
};

const STORAGE_KEY = 'p5m_selected_group';

let participants = []; // {nama, jabatan, status, catatan}
let currentGroup = null;
let skippedTodayCount = 0; // jumlah peserta yang disembunyikan karena sudah absen hari ini
const STATUSES = ["HADIR","IZIN","SAKIT","CUTI","ALFA"];
const openNotes = new Set(); // idx peserta yang note-box-nya sedang terbuka, agar tidak ketutup saat re-render

function normalizeName_(s){
  return String(s || '').trim().toUpperCase();
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(()=>{ t.className = 'toast'; }, 2500);
}

function todayLabel(){
  const d = new Date();
  const opts = { weekday:'long', day:'2-digit', month:'long', year:'numeric' };
  return d.toLocaleDateString('id-ID', opts);
}

function updateGroupBanner(){
  document.getElementById('groupBannerName').textContent = currentGroup || '-';
  document.getElementById('historyGroupBannerName').textContent = currentGroup || '-';
}

function genId(){
  const bytes = new Uint8Array(4);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function formatTimestamp(d){
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}.${p(d.getMinutes())}.${p(d.getSeconds())}`;
}

// ================= NAVIGASI TAB =================
function showView(view){
  ['absen','riwayat','pengaturan'].forEach(v=>{
    document.getElementById('view-'+v).classList.toggle('hidden', v !== view);
  });
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.view === view);
  });
  document.getElementById('footerBar').classList.toggle('hidden', view !== 'absen');
  if(view === 'riwayat') loadHistory();
  if(view === 'pengaturan') document.getElementById('settingGroupValue').textContent = currentGroup || '-';
}
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> showView(btn.dataset.view));
});

// ================= ONBOARDING (pilih grup, disimpan permanen di HP ini) =================
async function initOnboarding(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    currentGroup = saved;
    updateGroupBanner();
    loadParticipants();
    return;
  }
  document.getElementById('onboardModal').classList.remove('hidden');
  try{
    const res = await fetch(`${CONFIG.API_URL}?action=getGroups`);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Gagal memuat grup');
    const select = document.getElementById('onboardGroupSelect');
    if(!data.groups || data.groups.length === 0){
      select.innerHTML = '<option value="">Belum ada grup di Master Data</option>';
      return;
    }
    select.innerHTML = '<option value="">-- Pilih Grup --</option>' +
      data.groups.map(g => `<option value="${g}">${g}</option>`).join('');
  }catch(err){
    showToast('Gagal memuat daftar grup: ' + err.message, 'error');
  }
}

document.getElementById('onboardGroupSelect').addEventListener('change', (e)=>{
  document.getElementById('onboardStartBtn').disabled = !e.target.value;
});

document.getElementById('onboardStartBtn').addEventListener('click', ()=>{
  const group = document.getElementById('onboardGroupSelect').value;
  if(!group) return;
  localStorage.setItem(STORAGE_KEY, group);
  currentGroup = group;
  updateGroupBanner();
  document.getElementById('onboardModal').classList.add('hidden');
  loadParticipants();
});

document.getElementById('changeGroupBtn').addEventListener('click', ()=>{
  document.getElementById('pinInput').value = '';
  document.getElementById('pinModal').classList.remove('hidden');
  document.getElementById('pinInput').focus();
});

document.getElementById('pinCancelBtn').addEventListener('click', ()=>{
  document.getElementById('pinModal').classList.add('hidden');
});

function attemptChangeGroup(){
  const val = document.getElementById('pinInput').value;
  if(!val) return;
  const btn = document.getElementById('pinConfirmBtn');
  btn.disabled = true;
  btn.textContent = 'Memeriksa...';
  fetch(`${CONFIG.API_URL}?action=getPin`)
    .then(res => res.json())
    .then(data => {
      if(!data.ok) throw new Error(data.error || 'Gagal memeriksa sandi');
      if(val !== data.pin){
        showToast('Sandi salah', 'error');
        return;
      }
      document.getElementById('pinModal').classList.add('hidden');
      localStorage.removeItem(STORAGE_KEY);
      currentGroup = null;
      participants = [];
      updateGroupBanner();
      showView('absen');
      initOnboarding();
    })
    .catch(err => showToast('Gagal memeriksa sandi: ' + err.message, 'error'))
    .finally(() => {
      btn.disabled = false;
      btn.textContent = 'Konfirmasi';
    });
}
document.getElementById('pinConfirmBtn').addEventListener('click', attemptChangeGroup);
document.getElementById('pinInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') attemptChangeGroup();
});

// ================= ABSEN (beranda) =================
async function loadParticipants(){
  const card = document.getElementById('listCard');
  card.innerHTML = '<div class="loading">Memuat data peserta...</div>';
  openNotes.clear();
  try{
    const [namesData, historyData] = await Promise.all([
      fetch(`${CONFIG.API_URL}?action=getNames&group=${encodeURIComponent(currentGroup)}`).then(r=>r.json()),
      fetch(`${CONFIG.API_URL}?action=getHistory&group=${encodeURIComponent(currentGroup)}&date=${encodeURIComponent(todayISO())}`).then(r=>r.json())
    ]);
    if(!namesData.ok) throw new Error(namesData.error || 'Gagal memuat data');

    const alreadyToday = new Set();
    if(historyData.ok && historyData.rows){
      historyData.rows.forEach(r => alreadyToday.add(normalizeName_(r.nama)));
    }

    const allParticipants = namesData.names.map(item => ({
      nama: item.nama,
      jabatan: item.jabatan || '',
      status: '',
      catatan: ''
    }));
    skippedTodayCount = allParticipants.filter(p => alreadyToday.has(normalizeName_(p.nama))).length;
    participants = allParticipants.filter(p => !alreadyToday.has(normalizeName_(p.nama)));
    renderList();
  }catch(err){
    card.innerHTML = `<div class="empty">Gagal memuat data peserta.<br>${err.message}</div>`;
    showToast('Gagal memuat data peserta', 'error');
  }
}

function renderList(){
  const card = document.getElementById('listCard');
  if(participants.length === 0){
    card.innerHTML = skippedTodayCount > 0
      ? '<div class="empty">Semua peserta di grup ini sudah mengisi absen hari ini.<br>Kalau ada yang salah input, ubah lewat tab Riwayat.</div>'
      : '<div class="empty">Tidak ada data peserta untuk grup ini di Master Data.</div>';
    updateSummary();
    return;
  }
  card.innerHTML = participants.map((p, i) => `
    <div class="row" data-idx="${i}">
      <div class="num">${i+1}</div>
      <div class="name"><span class="name-text">${escapeHtml(p.nama)}</span>${p.jabatan ? `<div class="jabatan">${escapeHtml(p.jabatan)}</div>` : ''}</div>
      <button class="note-toggle ${p.catatan ? 'has-note' : ''}" data-idx="${i}" title="Catatan">✎</button>
      <div class="status-group">
        ${STATUSES.map(s => `<button class="status-btn ${p.status===s?'active':''}" data-idx="${i}" data-status="${s}">${s}</button>`).join('')}
      </div>
    </div>
    <div class="note-input${openNotes.has(i) ? ' open' : ''}" data-note-idx="${i}">
      <input type="text" placeholder="Catatan (opsional)" value="${escapeHtml(p.catatan)}" data-note-field="${i}">
    </div>
  `).join('');

  card.querySelectorAll('.status-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = +btn.dataset.idx;
      participants[idx].status = btn.dataset.status;
      renderList();
    });
  });
  card.querySelectorAll('.note-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = +btn.dataset.idx;
      if(openNotes.has(idx)) openNotes.delete(idx); else openNotes.add(idx);
      const box = card.querySelector(`.note-input[data-note-idx="${idx}"]`);
      box.classList.toggle('open');
    });
  });
  card.querySelectorAll('[data-note-field]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      participants[+inp.dataset.noteField].catatan = inp.value;
    });
  });

  updateSummary();
}

function updateSummary(){
  const filled = participants.filter(p=>p.status).length;
  let label = `${participants.length} peserta &middot; <b>${filled}</b> sudah diisi`;
  if(skippedTodayCount > 0){
    label += ` &middot; ${skippedTodayCount} sudah absen hari ini (disembunyikan)`;
  }
  document.getElementById('summaryLabel').innerHTML = label;
  document.getElementById('saveBtn').disabled = filled === 0;
}

document.getElementById('markAllHadir').addEventListener('click', ()=>{
  participants.forEach(p => { if(!p.status) p.status = 'HADIR'; });
  renderList();
});
document.getElementById('clearAll').addEventListener('click', ()=>{
  participants.forEach(p => { p.status=''; p.catatan=''; });
  renderList();
});
document.getElementById('refreshBtn').addEventListener('click', ()=>{
  if(!currentGroup) return;
  const activeView = document.querySelector('.nav-btn.active').dataset.view;
  if(activeView === 'riwayat') loadHistory(); else loadParticipants();
});

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const toSave = participants.filter(p => p.status);
  if(toSave.length === 0) return;

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  const now = new Date();
  const rows = toSave.map(p => ({
    idPeserta: genId(),
    timestamp: formatTimestamp(now),
    nama: p.nama,
    jabatan: p.jabatan || '',
    keterangan: p.status,
    catatan: p.catatan || ''
  }));

  try{
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'saveAttendance', group: currentGroup, rows })
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Gagal menyimpan');
    if(data.skipped > 0){
      showToast(`Tersimpan ${data.saved} · ${data.skipped} dilewati (sudah absen hari ini)`, data.saved > 0 ? 'ok' : 'error');
    }else{
      showToast(`Berhasil menyimpan ${data.saved} absensi ke "${currentGroup}"`, 'ok');
    }
    await loadParticipants();
  }catch(err){
    showToast('Gagal menyimpan: ' + err.message, 'error');
  }finally{
    btn.textContent = 'Simpan Semua';
    updateSummary();
  }
});

// ================= RIWAYAT =================
function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function isoDaysAgo(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  const p = x => String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
const historyDateEl = document.getElementById('historyDateInput');
historyDateEl.value = todayISO();
historyDateEl.max = todayISO();
historyDateEl.min = isoDaysAgo(6);

let historyRowsCache = [];
let historyEdits = {};

async function loadHistory(){
  if(!currentGroup) return;
  const card = document.getElementById('historyCard');
  card.innerHTML = '<div class="loading">Memuat riwayat...</div>';
  const dateVal = document.getElementById('historyDateInput').value;
  try{
    const res = await fetch(`${CONFIG.API_URL}?action=getHistory&group=${encodeURIComponent(currentGroup)}&date=${encodeURIComponent(dateVal)}`);
    const data = await res.json();
    if(!data.ok){
      card.innerHTML = `<div class="empty">${data.error || 'Gagal memuat riwayat'}</div>`;
      return;
    }
    if(!data.rows || data.rows.length === 0){
      card.innerHTML = '<div class="empty">Belum ada riwayat absen pada tanggal ini.</div>';
      return;
    }
    const filled = data.rows.filter(r => r.keterangan && r.keterangan.trim() !== '');
    if(filled.length === 0){
      card.innerHTML = '<div class="empty">Belum ada riwayat absen pada tanggal ini.</div>';
      return;
    }
    historyRowsCache = filled;
    historyEdits = {};
    filled.forEach((r,i)=>{ historyEdits[i] = { status: r.keterangan, catatan: r.catatan || '' }; });

    card.innerHTML = filled.map((r, i) => `
      <div class="history-item">
        <div class="history-top">
          <div class="history-name">${escapeHtml(r.nama)}</div>
          <div class="history-time">${escapeHtml(r.timestamp)}</div>
        </div>
        ${r.jabatan ? `<div class="history-meta">${escapeHtml(r.jabatan)}</div>` : ''}
        <div class="history-bottom">
          <span class="history-badge ${escapeHtml(r.keterangan)}">${escapeHtml(r.keterangan)}</span>
          <button class="btn-ghost history-edit-btn" data-hist-idx="${i}">Ubah</button>
        </div>
        ${r.catatan ? `<div class="history-meta">Catatan: ${escapeHtml(r.catatan)}</div>` : ''}
        <div class="history-edit-box" data-hist-edit="${i}">
          <div class="status-group">
            ${STATUSES.map(s => `<button class="status-btn hist-status-btn ${r.keterangan===s?'active':''}" data-hist-idx="${i}" data-status="${s}">${s}</button>`).join('')}
          </div>
          <input type="text" class="hist-note-input" placeholder="Catatan (opsional)" value="${escapeHtml(r.catatan)}" data-hist-note="${i}">
          <div class="hist-edit-actions">
            <button class="btn-primary hist-save-btn" data-hist-idx="${i}">Simpan Perubahan</button>
            <button class="btn-ghost hist-cancel-btn" data-hist-idx="${i}">Batal</button>
          </div>
        </div>
      </div>
    `).join('');

    card.querySelectorAll('.history-edit-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = btn.dataset.histIdx;
        card.querySelector(`.history-edit-box[data-hist-edit="${idx}"]`).classList.toggle('open');
      });
    });
    card.querySelectorAll('.hist-status-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = btn.dataset.histIdx;
        historyEdits[idx].status = btn.dataset.status;
        card.querySelectorAll(`.hist-status-btn[data-hist-idx="${idx}"]`).forEach(b=>{
          b.classList.toggle('active', b.dataset.status === historyEdits[idx].status);
        });
      });
    });
    card.querySelectorAll('.hist-note-input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        historyEdits[inp.dataset.histNote].catatan = inp.value;
      });
    });
    card.querySelectorAll('.hist-cancel-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = btn.dataset.histIdx;
        const row = historyRowsCache[idx];
        historyEdits[idx] = { status: row.keterangan, catatan: row.catatan || '' };
        card.querySelector(`.history-edit-box[data-hist-edit="${idx}"]`).classList.remove('open');
        card.querySelectorAll(`.hist-status-btn[data-hist-idx="${idx}"]`).forEach(b=>{
          b.classList.toggle('active', b.dataset.status === historyEdits[idx].status);
        });
        const inp = card.querySelector(`.hist-note-input[data-hist-note="${idx}"]`);
        if(inp) inp.value = historyEdits[idx].catatan;
      });
    });
    card.querySelectorAll('.hist-save-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const idx = btn.dataset.histIdx;
        const row = historyRowsCache[idx];
        const edit = historyEdits[idx];
        if(!edit.status){ showToast('Pilih status terlebih dahulu', 'error'); return; }
        btn.disabled = true;
        btn.textContent = 'Menyimpan...';
        try{
          const res2 = await fetch(CONFIG.API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'updateAttendance',
              group: currentGroup,
              idPeserta: row.idPeserta,
              timestamp: row.timestamp,
              nama: row.nama,
              keterangan: edit.status,
              catatan: edit.catatan
            })
          });
          const data2 = await res2.json();
          if(!data2.ok) throw new Error(data2.error || 'Gagal menyimpan perubahan');
          showToast('Absensi berhasil diubah', 'ok');
          loadHistory();
        }catch(err){
          showToast('Gagal mengubah: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Simpan Perubahan';
        }
      });
    });
  }catch(err){
    card.innerHTML = `<div class="empty">Gagal memuat riwayat.<br>${err.message}</div>`;
    showToast('Gagal memuat riwayat', 'error');
  }
}
document.getElementById('refreshHistoryBtn').addEventListener('click', loadHistory);
document.getElementById('historyDateInput').addEventListener('change', loadHistory);

// ================= INIT =================
document.getElementById('dateLabel').textContent = todayLabel();
initOnboarding();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
